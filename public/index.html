<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Bot Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #1a1a2e; color: #eee; padding: 20px; }
        .status-online { color: #0f0; font-weight: bold; }
        .status-offline { color: #f00; font-weight: bold; }
        .card-custom { background: #16213e; border: none; border-radius: 15px; padding: 15px; margin-bottom: 15px; }
        .command-history { background: #0f3460; padding: 10px; border-radius: 10px; max-height: 150px; overflow-y: scroll; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-robot"></i> Bot Dashboard</h1>
        <hr>

        <div class="row">
            <div class="col-md-6">
                <div class="card-custom">
                    <h3><i class="fas fa-info-circle"></i> Bot Status</h3>
                    <p><strong>Trạng thái:</strong> <span id="status" class="status-online">Đang kết nối...</span></p>
                    <p><strong>Username:</strong> <span id="username">AdminBot</span></p>
                    <p><strong>Máu:</strong> <span id="health">0</span> / 20</p>
                    <p><strong>Thức ăn:</strong> <span id="food">0</span> / 20</p>
                    <p><strong>Vị trí:</strong> <span id="position">0, 0, 0</span></p>
                </div>
                <div class="card-custom">
                    <h3><i class="fas fa-bolt"></i> Quick Actions</h3>
                    <button class="btn btn-success btn-sm" onclick="sendCommand('/reconnect')"><i class="fas fa-sync"></i> Reconnect</button>
                    <button class="btn btn-danger btn-sm" onclick="sendCommand('/disconnect')"><i class="fas fa-plug"></i> Disconnect</button>
                    <button class="btn btn-warning btn-sm" onclick="sendCommand('/reset')"><i class="fas fa-undo"></i> Reset Stats</button>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card-custom">
                    <h3><i class="fas fa-terminal"></i> Send Command</h3>
                    <div class="input-group mb-3">
                        <input type="text" id="commandInput" class="form-control" placeholder="Nhập lệnh chat...">
                        <button class="btn btn-primary" onclick="sendCommand()"><i class="fas fa-paper-plane"></i> Send</button>
                    </div>
                    <div id="commandHistory" class="command-history">
                        <small>Lịch sử lệnh sẽ hiện ở đây...</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io();
        
        socket.on('bot-status', (data) => {
            document.getElementById('status').textContent = 'Online';
            document.getElementById('status').className = 'status-online';
            document.getElementById('health').textContent = data.health.toFixed(1);
            document.getElementById('food').textContent = data.food.toFixed(1);
            document.getElementById('position').textContent = data.position;
        });

        async function sendCommand(cmd) {
            const input = document.getElementById('commandInput');
            const command = cmd || input.value;
            if (!command) return;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command })
                });
                const result = await response.json();
                if (result.success) {
                    const history = document.getElementById('commandHistory');
                    history.innerHTML += `<div>> ${command}</div>`;
                    history.scrollTop = history.scrollHeight;
                }
            } catch (error) {
                console.error('Lỗi gửi lệnh:', error);
            }
            input.value = '';
        }

        socket.on('disconnect', () => {
            document.getElementById('status').textContent = 'Offline';
            document.getElementById('status').className = 'status-offline';
        });
    </script>
</body>
</html>
